<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#183d32">
  <meta name="robots" content="noindex, nofollow">
  <title>Entrar · Memórias do Nathanael</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="premium.css">
  <link rel="stylesheet" href="extra.css">
  <script>try{var t=localStorage.getItem("tema")||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");document.documentElement.dataset.theme=t}catch(e){}</script>
</head>
<body class="login-page">
  <main class="login-wrap">
    <form id="login-form" class="login-card" autocomplete="on">
      <span class="brand-mark login-mark">N</span>
      <h1>Memórias do Nathanael</h1>
      <p id="login-sub" class="login-sub">Entre com seu e-mail e senha para ver as fotos da família.</p>

      <label class="field-label cadastro-only hidden" for="nome">Seu nome</label>
      <input id="nome" class="text-input cadastro-only hidden" type="text" maxlength="60" autocomplete="name">

      <label class="field-label" for="email">E-mail</label>
      <input id="email" class="text-input" type="email" autocomplete="username" inputmode="email" required>

      <label class="field-label" for="senha">Senha</label>
      <div class="pass-row">
        <input id="senha" class="text-input" type="password" autocomplete="current-password" required>
        <button id="ver-senha" class="ghost-button small-btn" type="button">Mostrar</button>
      </div>

      <button id="enviar" class="primary-button login-submit" type="submit"><span id="enviar-texto">Entrar</span> <span aria-hidden="true">→</span></button>
      <p id="msg" class="upload-status" role="alert"></p>
      <p class="login-note"><span id="troca-texto">Primeira vez aqui?</span> <button id="troca" class="text-button" type="button">Pedir acesso</button></p>
    </form>
  </main>
  <script>
    const f = document.getElementById("login-form"), msg = document.getElementById("msg"), senha = document.getElementById("senha");
    const extras = document.querySelectorAll(".cadastro-only"), btn = document.getElementById("enviar");
    let cadastro = false;

    fetch("/api/me").then((r) => { if (r.ok) location.href = "/"; }).catch(() => {});

    document.getElementById("ver-senha").addEventListener("click", (e) => {
      const mostrar = senha.type === "password"; senha.type = mostrar ? "text" : "password"; e.target.textContent = mostrar ? "Ocultar" : "Mostrar";
    });

    function modo(novo) {
      cadastro = novo; msg.textContent = ""; msg.classList.remove("ok");
      extras.forEach((el) => el.classList.toggle("hidden", !cadastro));
            senha.autocomplete = cadastro ? "new-password" : "current-password";
      document.getElementById("login-sub").textContent = cadastro
        ? "Peça seu acesso. Assim que for aprovado, você poderá entrar."
        : "Entre com seu e-mail e senha para ver as fotos da família.";
      document.getElementById("enviar-texto").textContent = cadastro ? "Pedir acesso" : "Entrar";
      document.getElementById("troca-texto").textContent = cadastro ? "Já tem conta?" : "Primeira vez aqui?";
      document.getElementById("troca").textContent = cadastro ? "Entrar" : "Pedir acesso";
    }
    document.getElementById("troca").addEventListener("click", () => modo(!cadastro));

    f.addEventListener("submit", async (ev) => {
      ev.preventDefault(); msg.textContent = "";
      btn.disabled = true;
      try {
        const corpo = cadastro
          ? { nome: f.nome.value, email: f.email.value, senha: senha.value }
          : { email: f.email.value, senha: senha.value };
        const r = await fetch(cadastro ? "/api/cadastro" : "/api/login", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(corpo) });
        const d = await r.json().catch(() => ({}));
        if (!r.ok) throw new Error(d.erro || "Não foi possível continuar.");
        if (d.pendente) {
          modo(false); f.reset();
          msg.classList.add("ok");
          msg.textContent = "Pedido enviado! Assim que o administrador aprovar, você já pode entrar com seu e-mail e senha.";
          btn.disabled = false;
          return;
        }
        location.href = "/";
      } catch (e) { msg.classList.remove("ok"); msg.textContent = e.message; btn.disabled = false; }
    });
  </script>
</body>
</html>
